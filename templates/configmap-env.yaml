{{- if and .Values.configMap.enabled .Values.configMap.value.env }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-environment
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "antpolis-app.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.configMap.value.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
