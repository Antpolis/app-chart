{{- if .Values.configMap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-configs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "antpolis-app.labels" . | nindent 4 }}
data:
  {{- if .Values.configMap.value.files }}
  {{- range $key, $file := .Values.configMap.value.files }}
  {{ $key }}: |
    {{- $file | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}