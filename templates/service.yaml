apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-service
  labels:
    {{- include "antpolis-app.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "antpolis-app.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.app.port }}
      targetPort: {{ .Values.app.port }}