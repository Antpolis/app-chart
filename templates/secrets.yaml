{{- $secrets := fromYaml (include "antpolis-app.mergeSecrets" .) }}
{{- if $secrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    {{- include "antpolis-app.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $secrets.wordpress }}
  {{- range $key, $value := $secrets.wordpress }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}